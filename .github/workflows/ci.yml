name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend-app
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend-app
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build frontend
        working-directory: frontend-app
        run: npm run build
      - name: Run tests
        run: python -m pytest -q
      - name: Install browser for editor test
        working-directory: frontend-app
        run: npx playwright install --with-deps chromium
      - name: Test editor in browser
        run: |
          python -m uvicorn server.app:create_app --factory --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/studio/health > /dev/null; then break; fi
            sleep 1
          done
          node frontend-app/scripts/browser_smoke.js
